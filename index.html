<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northstar Lens</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <p class="eyebrow">Visual discovery</p>
        <h1>Northstar Lens</h1>
      </div>

      <form id="search-form" class="search-form" aria-label="Image search form">
        <label for="search-input" class="sr-only">Search for images</label>
        <input
          id="search-input"
          type="search"
          name="search"
          placeholder="Search landscapes, animals, cities..."
        />
        <button id="search-button" type="submit">Search</button>
        <button id="clear-button" class="clear-button" type="button">Clear</button>
      </form>
    </header>

    <main class="content">
      <div class="feature-row" aria-label="Quick search categories">
        <button type="button" class="chip">Nature</button>
        <button type="button" class="chip">Cities</button>
        <button type="button" class="chip">Animals</button>
        <button type="button" class="chip">Travel</button>
      </div>

      <div class="status-bar">
        <p id="result-count" class="result-count">Showing 0 results</p>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme">
          Night mode
        </button>
      </div>

      <p id="empty-state" class="empty-state">Search to see results</p>
      <section id="results" class="results-grid" aria-live="polite"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
